# Coturn TURN/STUN Server Configuration for MeetCall

# Network listening ports
listening-port=3478
tls-listening-port=5349

# Min and max UDP relay ports
min-port=49152
max-port=65535

# Fingerprint in all STUN/TURN packets
fingerprint

# Long-term credential mechanism
lt-cred-mech
use-auth-secret
static-auth-secret=meetcall-turn-secret-change-in-production
realm=meetcall.local

# Session and allocation quotas
total-quota=200
user-quota=10
stale-nonce=600

# Security: do not allow loopback or local network relaying
no-loopback-peers
no-multicast-peers

# Logging
verbose
log-file=stdout
