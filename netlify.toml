[build]
  publish = "apps/web/dist"
  command = "pnpm --filter @meetcall/shared build && pnpm --filter @meetcall/web build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
  NPM_FLAGS = "--no-frozen-lockfile"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
