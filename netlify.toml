[build]
  base = ""
  publish = "apps/web/dist"
  command = "pnpm --filter @meetcall/shared build && pnpm --filter @meetcall/web build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_API_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
